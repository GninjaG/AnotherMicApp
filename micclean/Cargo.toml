[package]
name = "micclean"
version = "0.2.0"
edition = "2024"

[lib]
name = "micclean"
path = "src/lib.rs"

[[bin]]
name = "AMA"
path = "src/main.rs"

[[bin]]
name = "mctools"
path = "src/bin/mctools.rs"

[[bin]]
name = "mcbench"
path = "src/bin/mcbench.rs"

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b89", version = "0.5.7-pre", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
sonora = "0.3.0"
wasapi = "0.27.0"
rubato = "5.1.0"
rtrb = "0.4.1"
hound = "3.5.1"
toml = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
tray-icon = "0.26.1"
realfft = "3.5.1"
rustfft = "6.4.1"
base64 = "0.22"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
global-hotkey = "0.10.0"
rfd = "0.15"
raw-window-handle = "0.6.2"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Media", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.test]
opt-level = 3

[profile.dev.package."*"]
debug-assertions = false
opt-level = 3
